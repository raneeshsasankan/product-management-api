services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: product_management_db
      POSTGRES_USER: product_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    image: product-management-api:1.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/product_management_db
      SPRING_DATASOURCE_USERNAME: product_admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_FLYWAY_ENABLED: "true"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin-init:
    image: product-management-api:1.0
    profiles:
      - setup
    environment:
      SPRING_PROFILES_ACTIVE: local,bootstrap-admin
      APP_BOOTSTRAP_EXIT_AFTER_RUN: "true"
      SERVER_PORT: "0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/product_management_db
      SPRING_DATASOURCE_USERNAME: product_admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_FLYWAY_ENABLED: "true"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
